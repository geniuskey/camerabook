    ["맑은 날 f/1.8로 24p 영상을 찍을 때 필요한 것은?", ["ND 필터", "높은 ISO", "플래시"], 0, "셔터가 1/50로 묶여 있으니 빛을 줄여야 한다.", "video"],
    ["폰 인물 모드가 머리카락 경계에서 실수하는 이유는?", ["렌즈가 작아서", "깊이 지도 추정이 어려워서", "셔터가 느려서"], 1, "소프트웨어 보케는 깊이 지도의 정확도에 달려 있다.", "smartphone"],
    ["폰 카메라 앱의 2× 버튼(1×와 3× 카메라만 있을 때)은?", ["광학 줌", "메인 카메라를 잘라 쓰는 디지털 줌", "망원 카메라를 넓게 쓰는 것"], 1, "사이 배율은 넓은 쪽 카메라를 잘라 쓴다.", "smartphone"],
  ];
  const box = document.getElementById("final");
  let answered = 0, correct = 0;
  function build() {
    answered = 0; correct = 0;
    box.innerHTML = Q.map(([q, opts, a, exp, ch], i) => `<div class="quiz-q"><p>${i + 1}. ${q}<span class="ch">${chs[ch].num}장</span></p><div class="opts">${opts.map((o, k) => `<button class="opt"${k === a ? " data-correct" : ""}>${o}</button>`).join("")}</div><div class="quiz-exp">${exp} <a href="${ch}.html">${chs[ch].title} 복습 →</a></div></div>`).join("");
    box.querySelectorAll(".quiz-q").forEach((qq) => {
      const opts = [...qq.querySelectorAll("button.opt")];
      opts.forEach((b) => b.addEventListener("click", () => {
        opts.forEach((o) => { o.disabled = true; if (o.hasAttribute("data-correct")) o.classList.add("right"); });
        if (!b.hasAttribute("data-correct")) b.classList.add("wrong"); else correct++;
        qq.classList.add("done"); answered++; score();
      }));
    });
    score();
  }
  function score() {
    document.getElementById("sc-t").textContent = answered === Q.length ? `완료! ${correct} / ${Q.length} 정답 ${correct >= Q.length * 0.9 ? "— 카메라 마스터 🎉" : correct >= Q.length * 0.7 ? "— 훌륭해요!" : "— 틀린 장을 복습해 보세요"}` : `${correct} 정답 · ${answered} / ${Q.length} 풀이`;
    document.getElementById("sc-b").style.width = (answered / Q.length) * 100 + "%";
  }
  document.getElementById("sc-r").addEventListener("click", build);
  build();
})();
</script>
</body>
</html>
